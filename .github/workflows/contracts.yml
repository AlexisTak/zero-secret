name: contracts

# Contrat public (contracts/) : lint, compatibilité ascendante, et fichiers générés à jour.
# Règle absolue #8 du CLAUDE.md — contracts/ est la source de vérité, jamais un fichier
# généré écrit à la main. Voir docs/backlog.md L0.3.
on:
  pull_request:
    paths:
      - "contracts/**"
      - "pkg/gen/**"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "pkg/gen/**"

# Jeton par defaut reduit a la lecture pour TOUS les jobs : ci.yml se declenche sur
# pull_request, donc sur des PR de forks, et plusieurs jobs executent du code tiers
# (cargo install, go install ...@latest, npm ci). Un bloc permissions au niveau job
# REMPLACE ce defaut : le job provenance, qui a besoin d'ecrire, declare deja les
# siennes explicitement et n'est donc pas affecte.
permissions:
  contents: read

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # buf breaking compare contre main : historique complet requis

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1

      - name: buf lint
        run: buf lint
        working-directory: contracts

      - name: fetch main (checkout ne crée pas la ref locale sur un événement pull_request)
        if: github.event_name == 'pull_request'
        run: git fetch origin main:main

      - name: buf breaking (contre main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against '../.git#branch=main,subdir=contracts'
        working-directory: contracts

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"

      - name: install protoc-gen-go / protoc-gen-go-grpc
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: fichiers générés à jour (pkg/gen)
        run: |
          buf generate
          git diff --exit-code -- ../pkg/gen || {
            echo "::error::pkg/gen diverge de contracts/proto — lancer make generate et committer." >&2
            exit 1
          }
        working-directory: contracts
