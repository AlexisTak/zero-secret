name: ci

# Chaîne CI — backlog L0.4. Étapes dans l'ordre attendu : format → lint → détection de secrets
# → build → tests → tests d'architecture → analyse de dépendances → SBOM → CBOM → build
# reproductible → signature/attestation.
#
# Exécuteurs GitHub-hosted : éphémères par construction (règle absolue #1 — aucun secret
# durable stocké ; ce que la CI a besoin de prouver son identité, elle le fait via l'OIDC de
# GitHub, jamais via un secret de dépôt). Bascule depuis Jenkins — voir ADR-033 (remplace
# ADR-005) : la dérogation « clé cosign stockée dans le Jenkins Credentials Store » disparaît
# avec Jenkins, remplacée par la signature keyless native de cette plateforme.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # fuzzing nocturne (audit.md §5.4) — pas sur chaque PR, coût trop élevé
  workflow_dispatch:

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

# Jeton par defaut reduit a la lecture pour TOUS les jobs : ci.yml se declenche sur
# pull_request, donc sur des PR de forks, et plusieurs jobs executent du code tiers
# (cargo install, go install ...@latest, npm ci). Un bloc permissions au niveau job
# REMPLACE ce defaut : le job provenance, qui a besoin d'ecrire, declare deja les
# siennes explicitement et n'est donc pas affecte.
permissions:
  contents: read

jobs:
  format-lint:
    name: format + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: protoc (zs-policy/zs-identity le compilent via build.rs, ADR-004)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - name: go vet (par module, go.work multi-module)
        run: |
          go list -m -f '{{.Dir}}' | while IFS= read -r d; do
            (cd "$d" && go vet ./...) || exit 1
          done

  console-web:
    name: console-web (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build
      - run: node --test "dist/**/*.test.js"

  secrets:
    name: détection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks scanne l'historique, pas seulement HEAD
      - name: gitleaks (CLI directe, pas gitleaks-action — licence org requise par l'Action depuis 2025, pas par le binaire OSS)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --redact -v

  build-test:
    name: build + tests + tests d'architecture
    needs: [format-lint, secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Epinglee par SHA : l'action deduit sinon la toolchain du nom de la ref.
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: protoc (zs-policy/zs-identity le compilent via build.rs, ADR-004)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - run: cargo build --workspace
      - name: cargo nextest (repli sur cargo test si nextest absent)
        run: |
          cargo install --locked cargo-nextest 2>/dev/null || true
          cargo nextest run --all-features || cargo test --all-features
      - name: go build + test (par module)
        run: |
          go list -m -f '{{.Dir}}' | while IFS= read -r d; do
            (cd "$d" && go build ./... && go test ./... -race) || exit 1
          done
      - name: tests d'architecture (L0.2)
        run: bash tools/check-arch.sh

  coverage:
    name: couverture (informatif — ne bloque pas la CI, audit.md §3.3)
    needs: [build-test]
    runs-on: ubuntu-latest
    # Seuils du CLAUDE.md (≥85% crates/pkg, ≥95% zs-crypto/zs-policy/zs-audit) non mesurés
    # avant ce job : on mesure d'abord, on rendra bloquant dans un second temps une fois l'écart
    # réel connu (audit.md §3.3 recommandation).
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: protoc (zs-policy/zs-identity le compilent via build.rs, ADR-004)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - run: cargo install --locked cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path rust-coverage.lcov
      - name: go test -coverprofile (par module)
        run: |
          go list -m -f '{{.Dir}}' | while IFS= read -r d; do
            (cd "$d" && go test ./... -coverprofile=coverage.out) || exit 1
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            rust-coverage.lcov
            **/coverage.out
          retention-days: 90

  fuzz:
    name: fuzzing nocturne (audit.md §5.4)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { crate: zs-crypto, name: audit_seal_verify }
          - { crate: zs-crypto, name: identity_assertion_verify }
          - { crate: zs-webauthn, name: attestation_parser }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          # Epinglee par SHA : l'action deduit sinon la toolchain du nom de la ref.
          toolchain: nightly
      - run: cargo install --locked cargo-fuzz
      - name: fuzz ${{ matrix.target.crate }}/${{ matrix.target.name }} (5 min)
        working-directory: crates/${{ matrix.target.crate }}
        run: cargo fuzz run ${{ matrix.target.name }} -- -max_total_time=300
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target.crate }}-${{ matrix.target.name }}
          path: crates/${{ matrix.target.crate }}/fuzz/artifacts/${{ matrix.target.name }}/
          retention-days: 90

  dependency-analysis:
    name: analyse de dépendances
    needs: [build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Epinglee par SHA : l'action deduit sinon la toolchain du nom de la ref.
          toolchain: stable
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: cargo install --locked cargo-audit cargo-deny
      - run: cargo audit
      - run: cargo deny check licenses bans sources advisories
      - name: govulncheck (par module)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go list -m -f '{{.Dir}}' | while IFS= read -r d; do
            (cd "$d" && govulncheck ./...) || exit 1
          done

  security-quick:
    name: tests de sécurité (Phase 1)
    needs: [build-test]
    runs-on: ubuntu-latest
    # Ce job exécute `npm ci`, donc des scripts postinstall de dépendances tierces. Le jeton par
    # défaut est réduit à la lecture du dépôt : un job de vérification de sécurité n'a aucune
    # raison de pouvoir écrire quoi que ce soit.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Epinglee par SHA : l'action deduit sinon la toolchain du nom de la ref.
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: protoc (zs-policy/zs-identity le compilent via build.rs, ADR-004)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - name: npm ci (console-web)
        working-directory: apps/console-web
        run: npm ci
      # La cible echoue si un finding blocking=true subsiste dans le rapport agrege — decision
      # portee par l'agregateur, pas par un motif textuel. Les findings connus et acceptes sont
      # journalises en non bloquant (voir security/threat-models/admin-api.md, Risques acceptes).
      - name: make security-quick
        run: make security-quick
      # if: always() — le rapport est justement la preuve à conserver quand la cible échoue sur un
      # finding bloquant. Sans cela, l'artefact ne serait produit que dans le cas où il est le
      # moins utile.
      - name: rapport de sécurité agrégé
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rapport-securite
          path: tests/security/report/output/
          if-no-files-found: warn

  sbom-cbom:
    name: SBOM + CBOM
    needs: [build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Epinglee par SHA : l'action deduit sinon la toolchain du nom de la ref.
          toolchain: stable
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: protoc (zs-policy/zs-identity le compilent via build.rs, ADR-004)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - run: |
          cargo install --locked cargo-cyclonedx
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
      - run: bash tools/collect-sbom.sh
      - run: bash tools/generate-cbom.sh > security/crypto-inventory/cbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cbom
          path: |
            security/sbom/
            security/crypto-inventory/cbom.json
          retention-days: 90

  reproducible-build:
    name: build reproductible (informatif — ne bloque pas la CI)
    needs: [build-test]
    runs-on: ubuntu-latest
    # Vérifié localement (2026-08-22) : un cargo build --release identique, deux fois de suite,
    # produit des binaires DIFFÉRENTS bit à bit (ordre de codegen non déterministe entre autres
    # causes connues de l'écosystème Rust, sans -C codegen-units=1 / RUSTFLAGS dédiés). Rendre ce
    # job bloquant aujourd'hui casserait la CI sur un problème non résolu, pas sur une régression
    # introduite par une contribution — donc continue-on-error, en attendant l'ADR qui traite la
    # reproductibilité (SOURCE_DATE_EPOCH, toolchain figée, flags de build hermétique).
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Epinglee par SHA : l'action deduit sinon la toolchain du nom de la ref.
          toolchain: stable
      - name: protoc (zs-policy/zs-identity le compilent via build.rs, ADR-004)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - name: build deux fois, comparer les binaires
        run: |
          cargo build --release -p identity-provider -p policy-engine -p audit-sealer
          cp target/release/identity-provider /tmp/build1-identity-provider
          cp target/release/policy-engine /tmp/build1-policy-engine
          cp target/release/audit-sealer /tmp/build1-audit-sealer
          cargo clean --release -p identity-provider -p policy-engine -p audit-sealer
          cargo build --release -p identity-provider -p policy-engine -p audit-sealer
          diff <(sha256sum /tmp/build1-identity-provider | cut -d' ' -f1) \
               <(sha256sum target/release/identity-provider | cut -d' ' -f1)
          diff <(sha256sum /tmp/build1-policy-engine | cut -d' ' -f1) \
               <(sha256sum target/release/policy-engine | cut -d' ' -f1)
          diff <(sha256sum /tmp/build1-audit-sealer | cut -d' ' -f1) \
               <(sha256sum target/release/audit-sealer | cut -d' ' -f1)

  attest:
    name: signature + attestation de provenance
    needs: [build-test, dependency-analysis]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # attestation de provenance signée keyless (Sigstore/Fulcio via OIDC)
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Epinglee par SHA : l'action deduit sinon la toolchain du nom de la ref.
          toolchain: stable
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: protoc (zs-policy/zs-identity le compilent via build.rs, ADR-004)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - run: cargo build --release -p identity-provider -p policy-engine -p audit-sealer
      - name: build binaires Go
        run: |
          mkdir -p bin
          for app in access-broker admin-api audit-collector credential-issuer; do
            (cd "apps/$app" && go build -o "../../bin/$app" .)
          done
      - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: |
            target/release/identity-provider
            target/release/policy-engine
            target/release/audit-sealer
            bin/access-broker
            bin/admin-api
            bin/audit-collector
            bin/credential-issuer
