# cargo-deny — analyse de dépendances (backlog L0.4). Règle absolue #10 du CLAUDE.md racine :
# licence OSI, pas de copyleft fort ; à documenter en cas de dérogation.

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
# Nos propres crates (apps/, crates/) n'ont pas de champ license : publish = false partout
# (voir Cargo.toml racine, LICENSE à la racine du dépôt fait foi — AGPL-3.0). Ce n'est pas un
# oubli, cargo-deny ne doit pas les vérifier comme s'ils étaient destinés à crates.io.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # ar_archive_writer, outillage de build transitif via
    # aws-lc-sys — variante standard d'Apache-2.0 utilisée dans l'écosystème LLVM, OSI-reconnue.
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0", # OpenBao et dépendances associées — voir ADR-002
    "CDLA-Permissive-2.0", # webpki-roots (paquet de certificats racine Mozilla, dépendance
    # transitive de sqlx/rustls, H5/ADR-023) — licence de données (Linux Foundation), pas une
    # licence logicielle au sens strict de l'OSI, mais permissive et sans copyleft ; standard
    # pour ce type de paquet dans l'écosystème Rust TLS. Découverte en réactivant `cargo deny`
    # (2026-08-24), pas une nouvelle dépendance introduite ici.
]
confidence-threshold = 0.8

# Note : l'interdiction d'import crypto direct hors zs-crypto (règle absolue #4) n'est PAS
# exprimée ici — cargo-deny ne voit pas QUI importe une dépendance, seulement QUE le graphe la
# contient. Cette détection reste le rôle de tools/lib/check-no-direct-crypto.sh (L0.2).
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nos dépendances internes (crates/, apps/) sont en path sans version — normal pour un
# workspace, pas un risque de chaîne d'approvisionnement comme un "*" sur crates.io.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
