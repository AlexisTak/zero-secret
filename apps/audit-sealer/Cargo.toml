[package]
name = "audit-sealer"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Scellement d'événements d'audit (audit-seal/v1) — pont Rust<->Go, socket Unix uniquement, aucune logique de chaînage ni accès Postgres."

[lints]
workspace = true

[dependencies]
zs-audit-sealing = { path = "../../crates/zs-audit-sealing" }
zs-audit = { path = "../../crates/zs-audit" }
zs-crypto = { path = "../../crates/zs-crypto" }
thiserror = "2"
tonic = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
secrecy = "0.10"

[dev-dependencies]
tonic-prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tempfile = "3"
