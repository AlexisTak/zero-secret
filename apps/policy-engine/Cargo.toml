[package]
name = "policy-engine"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "PDP : évaluation de politique, sans état, aucun appel réseau pendant l'évaluation."

[lints]
workspace = true

[dependencies]
zs-policy = { path = "../../crates/zs-policy" }
zs-audit = { path = "../../crates/zs-audit" }
thiserror = "2"
tonic = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tonic-prost = "0.14"
prost-types = "0.14"
