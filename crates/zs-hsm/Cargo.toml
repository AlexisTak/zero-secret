[package]
name = "zs-hsm"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Intégration PKCS#11 (SoftHSM2 en dev). Seul crate autorisé à l'unsafe (FFI) — voir ADR."

# Pas d'héritage des lints du workspace : c'est le seul crate où unsafe_code n'est pas "forbid"
# (FFI PKCS#11, voir ADR-001). Cargo interdit de mélanger `workspace = true` et une redéfinition
# locale de lint dans le même manifeste.
[lints.rust]
unsafe_code = "allow"

[dependencies]
thiserror = "2"
cryptoki = "0.12"
# Réexportée par cryptoki (types AuthPin/RawAuthPin) — pas une bibliothèque crypto au sens de la
# règle absolue #4 : conteneur zeroizant, aucune primitive.
secrecy = "0.10"

# Bornes de capacité et timeout du pool de sessions (ADR-011) — pas une primitive crypto, aucune
# raison de passer par zs-crypto pour un mutex/condvar applicatif.
[dependencies.zeroize]
version = "1"
features = ["derive"]
