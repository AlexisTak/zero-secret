syntax = "proto3";

// Contrat d'émission de credential (L2.4, suite) — access-broker -> credential-issuer, appel
// interne service-à-service (pas une entrée navigateur, donc gRPC, pas HTTP — même distinction
// déjà posée pour policy.v1/identity.v1 vs contracts/openapi/).
//
// credential.issued n'est PAS scellé par ce contrat : aucun pont d'audit Rust<->Go n'existe pour
// ce composant (même angle mort qu'access-broker/admin-api, reconfirmé explicitement en ADR
// plutôt que silencieusement répété). Voir docs/architecture.md et l'ADR de ce lot.

package credential.v1;

option go_package = "github.com/Biscuits-ia/biscuits-shield/pkg/gen/credential/v1;credentialv1";

import "google/protobuf/duration.proto";
import "policy/v1/decision.proto";

service CredentialIssuanceService {
  // Émet un credential à durée bornée pour une décision ALLOW déjà signée par le PDP. Un refus
  // métier (décision absente/invalide/DENY, verbe non supporté, décision déjà consommée) n'est
  // jamais une erreur gRPC (P2, même discipline que Decide/VerifyAssertion) : EmissionResult
  // normal avec allowed: false. error gRPC réservée aux échecs de transport ou à un appel
  // OpenBao réellement tenté et échoué.
  //
  // EmissionOrder/EmissionResult (et non EmitRequest/EmitResponse) pour rester alignés avec le
  // vocabulaire déjà établi côté Go (apps/credential-issuer/internal/issuer, H2/L2.4) — même
  // raisonnement que DecisionRequest/DecisionResponse dans policy/v1/decision.proto.
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Emit(EmissionOrder) returns (EmissionResult);

  // Révoque un bail déjà émis.
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
}

message EmissionOrder {
  string verb              = 1;
  string resource_type     = 2;
  string resource_id       = 3;
  string authority_domain  = 4;
  // Décision COMPLÈTE, signée (decision-seal/v1, H4/ADR-019) — c'est elle qui est revérifiée
  // ici (policy.v1.VerifyDecision), jamais un champ isolé fourni séparément par l'appelant.
  policy.v1.DecisionResponse decision = 5;
}

message EmissionResult {
  bool allowed                          = 1;
  repeated string reasons               = 2;
  // Vides si allowed = false. Le bail lui-même (secret OpenBao) ne transite jamais par ce
  // contrat — seuls l'identifiant et la durée, pour que l'appelant sache qu'une émission a eu
  // lieu, jamais pour porter le secret (règle absolue #1).
  string lease_id                       = 3;
  google.protobuf.Duration lease_duration = 4;
}

message RevokeRequest {
  string lease_id = 1;
}

message RevokeResponse {}
