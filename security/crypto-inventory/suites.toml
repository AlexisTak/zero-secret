# Source de vérité du CBOM (ADR-011). `tools/generate-cbom.sh` dérive `cbom.json` (CycloneDX
# 1.6) depuis ce fichier — ne jamais éditer `cbom.json` à la main. Une suite référencée dans
# `crates/zs-crypto/src/**/*.rs` (motif `"<nom>/vN"`) sans entrée ici fait échouer
# `make test-arch` (invariant 9 de `crates/zs-crypto/CLAUDE.md`, comblé par H1/ADR-011 : jusque
# là, ce contrôle n'existait pas et `authenticator-proof/v1` était déjà en défaut).

[[suite]]
id = "authenticator-proof/v1"
role = "verification"
primitive = "signature"
algorithms = ["ECDSA P-256 (COSE -7)", "EdDSA (COSE -8)"]
execution_environment = "software"
anssi_2027_compliant = false
anssi_2027_exception_adr = "ADR-006"
adrs = ["ADR-006"]
notes = "Vérification seule : l'algorithme est imposé par l'authentificateur FIDO2 externe, pas choisi par nous (exception documentée à l'invariant 5 de zs-crypto/CLAUDE.md)."

[[suite]]
id = "identity-assertion/v1"
role = "emission"
primitive = "signature"
algorithms = ["ECDSA P-256"]
execution_environment = "hardware"
anssi_2027_compliant = false
successor = "identity-assertion/v2"
canonicalization = "RFC 8785 (JCS)"
hash = "SHA-256"
signature_encoding = "raw r||s, hexadécimal minuscule"
domain_separation = "zero-secret/identity-assertion/v1"
signature_container = "N composantes, arité et ordre imposés par la suite (R8/ADR-008/ADR-012)"
key_label = "zs-identity-assertion-v1"
adrs = ["ADR-007", "ADR-008", "ADR-011", "ADR-012", "ADR-023"]
notes = "Scellement et vérification réels implémentés (crates/zs-crypto::identity_assertion, L1.2c). Premier appelant applicatif réel de seal() : apps/identity-provider/src/httpapi.rs (H5, ADR-023), endpoint POST /v1/webauthn/authentication/verify."

[[suite]]
id = "audit-seal/v1"
role = "emission"
primitive = "signature"
algorithms = ["ECDSA P-256"]
execution_environment = "hardware"
anssi_2027_compliant = false
successor = "audit-seal/v2"
frequency = "per-business-action"
canonicalization = "RFC 8785 (JCS)"
hash = "SHA-256"
signature_encoding = "raw r||s, hexadécimal minuscule"
domain_separation = "zero-secret/audit-seal/v1"
signature_container = "objet {suite, components}, arité imposée par la suite — forme distincte d'identity-assertion (tableau au premier niveau), imposée par contracts/events/audit-event.schema.json, résorption visée en v2 (ADR-013)"
key_label = "zs-audit-seal-v1"
adrs = ["ADR-010", "ADR-011", "ADR-013", "ADR-023", "ADR-026", "ADR-027"]
notes = "Scellement et vérification réels implémentés (crates/zs-crypto::audit_seal, L1.4b) — opération HSM la plus fréquente du système (une par action métier, règle absolue #9). Premier appelant applicatif réel de seal() : apps/identity-provider/src/httpapi.rs (H5, ADR-023). Second appelant, second HSM/pool distinct d'identity-provider (même clé zs-audit-seal-v1, ouverture séparée) : apps/audit-sealer (ADR-026), pont Rust<->Go — sert Seal/HashPrevious sur socket Unix uniquement, jamais un port réseau, seul point d'entrée cryptographique pour les événements construits côté Go. Champ decision implémenté (ADR-027, extension additive de v1, aucun changement de suite/algorithme/canonicalisation/hachage/séparation de domaine — événements déjà scellés avant cet ajout restent vérifiables bit à bit, vecteurs figés tests/vectors/audit-seal-v1/chain.json inchangés) : porte policy.decided, câblé depuis apps/access-broker (ALLOW et DENY). decision.decision_signature/decision_signature_key_id recopiés de decision-seal/v1, non vérifiés au scellement — établissent l'origine PDP pour un vérificateur hors ligne indépendant, non construit dans ce dépôt à ce jour."

[[suite]]
id = "decision-binding/v1"
role = "integrity"
primitive = "hash"
algorithms = ["SHA-256"]
execution_environment = "software"
anssi_2027_compliant = true
canonicalization = "RFC 8785 (JCS) pour la requête ; arbre trié à longueur préfixée pour le corpus de politiques"
hash = "SHA-256"
domain_separation = "decision-binding/v1/request, decision-binding/v1/policy-corpus"
adrs = ["ADR-012", "ADR-013", "ADR-015"]
notes = "Empreintes d'intégrité (decision_hash/policy_version de DecisionResponse, L2.2), pas une suite de signature : aucune clé, pas d'émission/vérification, invariant d'hybridation PQC de zs-crypto/CLAUDE.md non applicable (concerne signature/échange de clé, pas le hachage de contenu)."

[[suite]]
id = "decision-seal/v1"
role = "emission"
primitive = "signature"
algorithms = ["ECDSA P-256"]
execution_environment = "hardware"
anssi_2027_compliant = false
successor = "decision-seal/v2"
frequency = "per-business-action"
canonicalization = "RFC 8785 (JCS) sur un objet de scellement dédié — pas le DecisionResponse protobuf brut"
hash = "SHA-256"
signature_encoding = "raw r||s, hexadécimal minuscule (transmis en bytes bruts côté proto)"
domain_separation = "zero-secret/decision-seal/v1"
signature_container = "champs decision_signature/decision_signature_key_id de DecisionResponse (proto), pas un document JSON opaque — DecisionResponse est déjà typé, pas reparsé depuis des octets non fiables"
key_label = "zs-decision-seal-v1"
adrs = ["ADR-011", "ADR-015", "ADR-019", "ADR-027"]
notes = "Authentifie l'origine PDP d'une DecisionResponse (policy-engine, L2.2) pour credential-issuer (L2.4), qui ne peut pas vérifier lui-même (ADR-001). Couvre effect/reasons/max_ttl/constraints/decision_hash/policy_version/issued_at — jamais decision_hash isolément (H4, ADR-019). Troisième clé HSM dédiée après zs-identity-assertion-v1/zs-audit-seal-v1. decision_signature/decision_signature_key_id également recopiés (non re-vérifiés) dans l'événement audit-seal/v1 policy.decided (ADR-027) — un futur vérificateur hors ligne possédant cette clé publique peut établir l'origine PDP indépendamment de audit-seal/v1."
